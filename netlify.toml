# Netlify: rebuild the pages from src/ and serve the site/ folder.
[build]
  command = "node build.js"
  publish = "site"

[build.environment]
  NODE_VERSION = "18"

# Netlify can't run PHP. Don't serve the handler source files.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
